# Server Configuration
server.port=8080

# LangChain4j OpenAI Configuration
# You can replace base-url with DeepSeek or Qwen API URL if compatible
langchain4j.open-ai.chat-model.api-key=demo
langchain4j.open-ai.chat-model.base-url=https://api.openai.com/v1
langchain4j.open-ai.chat-model.model-name=gpt-3.5-turbo
langchain4j.open-ai.chat-model.log-requests=true
langchain4j.open-ai.chat-model.log-responses=true

# Database Configuration (MySQL)
# Switch H2 to MySQL
# spring.datasource.url=jdbc:h2:mem:mathgraderdb
# spring.datasource.driverClassName=org.h2.Driver
# spring.datasource.username=sa
# spring.datasource.password=password
# spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/math_grader?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:123456}
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
# Optional: Set upload location if you want to store files locally instead of just forwarding
# app.upload.dir=E:/test/Pywork/math_grader/uploads

# Default user credentials (override via environment variables or JVM args)
app.default-users.student.username=${DEFAULT_STUDENT_USERNAME:student}
app.default-users.student.password=${DEFAULT_STUDENT_PASSWORD:123456}
app.default-users.teacher.username=${DEFAULT_TEACHER_USERNAME:teacher}
app.default-users.teacher.password=${DEFAULT_TEACHER_PASSWORD:123456}
app.default-users.admin.username=${DEFAULT_ADMIN_USERNAME:admin}
app.default-users.admin.password=${DEFAULT_ADMIN_PASSWORD:admin}

# CORS (comma-separated). Leave empty to disable cross-origin requests.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://127.0.0.1:8080}

# Dataset root (override when running from a different working directory)
app.data.root=${DATA_ROOT:}
