<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Math Grader - 角色选择</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen">

  <div class="text-center w-full max-w-2xl px-4">
    <div class="mb-10 animate-fade-in-up">
      <div class="w-16 h-16 bg-gradient-to-br from-indigo-500 to-indigo-700 rounded-2xl mx-auto flex items-center justify-center text-white text-3xl shadow-lg mb-4">
        <i class="fa-solid fa-shapes"></i>
      </div>
      <h1 class="text-3xl font-bold text-slate-800">欢迎使用智能判卷助手</h1>
      <p class="text-slate-500 mt-2">请选择您的身份以进入对应的工作台</p>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <!-- Student Role -->
      <a href="/student.html" onclick="selectRole('student')" 
         class="group bg-white p-8 rounded-2xl shadow-sm hover:shadow-xl hover:-translate-y-1 transition-all duration-300 border border-slate-200 hover:border-indigo-200">
        <div class="w-14 h-14 bg-emerald-50 text-emerald-600 rounded-full flex items-center justify-center text-2xl mb-4 group-hover:scale-110 transition mx-auto">
          <i class="fa-solid fa-user-pen"></i>
        </div>
        <h2 class="text-xl font-bold text-slate-800 mb-2">我是学生/用户</h2>
        <p class="text-sm text-slate-500 leading-relaxed">
          进入极简答题界面，专注于解答题目，提交答案并获取AI评分。
        </p>
      </a>

      <!-- Admin Role -->
      <a href="/admin.html" onclick="selectRole('admin')"
         class="group bg-white p-8 rounded-2xl shadow-sm hover:shadow-xl hover:-translate-y-1 transition-all duration-300 border border-slate-200 hover:border-indigo-200">
        <div class="w-14 h-14 bg-indigo-50 text-indigo-600 rounded-full flex items-center justify-center text-2xl mb-4 group-hover:scale-110 transition mx-auto">
          <i class="fa-solid fa-sliders"></i>
        </div>
        <h2 class="text-xl font-bold text-slate-800 mb-2">我是管理员/开发者</h2>
        <p class="text-sm text-slate-500 leading-relaxed">
          进入双模型调试台，监控互评流程，调试 Prompt，管理题库。
        </p>
      </a>
    </div>

    <div class="mt-12 text-xs text-slate-400">
      <p>系统已启用安全登录，点击上方角色将跳转至认证页面。</p>
    </div>
  </div>

  <script>
    // Local storage logic removed in favor of server-side auth
    localStorage.removeItem('math_grader_role');
  </script>
</body>
</html>
