<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Math Grader - 登录</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen">

  <div class="w-full max-w-md px-6">
    <div class="bg-white p-8 rounded-2xl shadow-lg border border-slate-100">
      <div class="text-center mb-8">
        <div class="w-16 h-16 bg-gradient-to-br from-indigo-500 to-indigo-700 rounded-2xl mx-auto flex items-center justify-center text-white text-3xl shadow-lg mb-4">
          <i class="fa-solid fa-shapes"></i>
        </div>
        <h1 class="text-2xl font-bold text-slate-800">欢迎回来</h1>
        <p class="text-slate-500 text-sm mt-1">请登录您的账号</p>
      </div>

      <div id="error-msg" class="hidden mb-4 p-3 bg-red-50 text-red-600 text-sm rounded-lg border border-red-100 flex items-center gap-2">
        <i class="fa-solid fa-circle-exclamation"></i>
        <span>用户名或密码错误</span>
      </div>

      <form action="/api/auth/login" method="post" class="space-y-5">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">用户名</label>
          <div class="relative">
            <span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"><i class="fa-solid fa-user"></i></span>
            <input type="text" name="username" required
                   class="w-full pl-10 pr-4 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all"
                   placeholder="请输入用户名">
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">密码</label>
          <div class="relative">
            <span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"><i class="fa-solid fa-lock"></i></span>
            <input type="password" name="password" required
                   class="w-full pl-10 pr-4 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all"
                   placeholder="请输入密码">
          </div>
        </div>

        <button type="submit" 
                class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-lg transition-colors shadow-sm hover:shadow-md flex items-center justify-center gap-2">
          <span>登录</span>
          <i class="fa-solid fa-arrow-right"></i>
        </button>
      </form>

      <div class="mt-6 pt-6 border-t border-slate-100 text-center text-xs text-slate-400">
        <p>默认账号: student / 123456</p>
        <p>默认管理员: admin / admin</p>
      </div>
    </div>
  </div>

  <script>
    // Check for error param
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('error')) {
      document.getElementById('error-msg').classList.remove('hidden');
    }
  </script>
</body>
</html>
